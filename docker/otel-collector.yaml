# OpenTelemetry Collector configuration for Sentry Agentic
#
# Receives OTLP spans and metrics from all Sentry Agentic processes,
# then fans out to Jaeger (traces) and Prometheus (metrics).
# No external exporters — all data stays within the SOC network.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Drop spans/metrics that have no service.name to avoid noisy cardinality
  filter/drop_unnamed:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == ""'

exporters:
  # Jaeger receives traces via OTLP gRPC (all-in-one image supports this natively)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus pulls metrics from the collector's built-in exporter endpoint
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: sentry-agentic
    const_labels:
      environment: docker

  # Minimal debug logging — change to "detailed" for local troubleshooting.
  # Fixed 2026-08-20: was "warn", not a valid debugexporter verbosity value
  # (only basic/normal/detailed are) -- the collector failed to start at
  # all with "unknown metrics level 'warn'", so nothing in this pipeline
  # ever ran, found while first actually starting --profile observability.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, filter/drop_unnamed]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
