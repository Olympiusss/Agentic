version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentry-postgres
    environment:
      # deeptempo/sentry_agentic_soc, not sentry/sentry_soc -- these values
      # only take effect on a genuinely fresh/empty volume (Postgres skips
      # init entirely once the data directory is non-empty), but they must
      # match every DATABASE_URL below and the rest of this app's own
      # conventions (env.example, backend/services default), or a fresh
      # deployment initializes under a name nothing else expects. Confirmed
      # live 2026-08-15/16: this compose file's original sentry/sentry_soc
      # never actually matched the real running database -- a container
      # recreate here doesn't touch existing data, but it did surface that
      # this file had never been exercised against reality before.
      POSTGRES_DB: sentry_agentic_soc
      POSTGRES_USER: deeptempo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Path is relative to this compose file (docker/), so ../ points at
      # the repo root where database/init/ actually lives.
      - ../database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptempo -d sentry_agentic_soc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Network egress restriction, 2026-08-19: postgres has no legitimate
    # reason to ever reach the internet -- internal-only (Docker's
    # `internal: true` flag below removes the default internet route
    # entirely for anything on this network). Callers (backend, daemon,
    # llm-worker) reach it by also being attached to internal-only, not
    # by this service being reachable from sentry-network.
    networks:
      - internal-only

  # Redis - Job queue backend for ARQ (LLM request queuing + session store)
  redis:
    image: redis:7-alpine
    container_name: sentry-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Same reasoning as postgres above -- redis never calls out anywhere.
    networks:
      - internal-only

  # SOC Backend API
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sentry-backend
    environment:
      # database/connection.py's DatabaseManager is the actual code path in
      # use -- it builds its connection from these five discrete vars
      # (POSTGRES_HOST defaulting to "localhost"), NOT from DATABASE_URL
      # (that string is only consulted by a different, less-used helper in
      # core/config.py). Confirmed live 2026-08-16: setting only
      # DATABASE_URL left this container trying to reach Postgres at
      # localhost:5432 -- inside a container, "localhost" is the container
      # itself, not the postgres service, so every DB call failed with
      # Connection Refused (and login failures surfaced as a generic
      # "invalid password" rather than the real underlying DB error).
      # POSTGRES_HOST must be the Compose service name here, never
      # "localhost" -- that's only correct for a host-run process.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sentry_agentic_soc
      - POSTGRES_USER=deeptempo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      - DATABASE_URL=postgresql://deeptempo:${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}@postgres:5432/sentry_agentic_soc
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
      - REDIS_URL=redis://redis:6379/0
      # Required at import time whenever DEV_MODE=false (backend/services/
      # auth_service.py raises RuntimeError otherwise) -- missing entirely
      # before 2026-08-16, so this service could never actually start in
      # its real (non-dev-bypass) auth mode.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      # mcp-config.json's sentinelone entry needs these to spawn purple-mcp
      # -- never referenced anywhere in this file before 2026-08-18, so the
      # container had zero path to a real SentinelOne credential regardless
      # of the uv-cache fix above (purple-mcp would validate-fail on
      # missing PURPLEMCP_CONSOLE_TOKEN/BASE_URL even with a warm cache).
      - SENTINELONE_API_TOKEN=${SENTINELONE_API_TOKEN:-}
      - SENTINELONE_CONSOLE_URL=${SENTINELONE_CONSOLE_URL:-}
      # Reputation lookups (capabilities/reputation.py, used by Athena's
      # artifact analysis, Hephaestus's malware analyst, and the Strategic
      # Insights panel) -- never wired to this service at all before
      # 2026-08-20, so every chat-triggered reputation check in the
      # backend process silently reported "not configured" regardless of
      # the real keys existing in the main .env.
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      # Mail delivery channel -- same bridge as soc-daemon's identical
      # block below, added 2026-08-18 (see that comment for why).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_FROM=${SMTP_FROM:-}
      - THREAT_NOTIFICATION_EMAILS=${THREAT_NOTIFICATION_EMAILS:-}
      # Real on/off switch for alert-notification email, added 2026-08-20 --
      # capabilities/synergy.py::_notification_emails() checks this so you
      # can pause email notifications without clearing/re-adding the real
      # SMTP credentials above every time. Default true (no-op if unset).
      # Telegram is a separate channel/toggle, unaffected by this.
      - DAEMON_EMAIL_NOTIFICATIONS_ENABLED=${DAEMON_EMAIL_NOTIFICATIONS_ENABLED:-true}
      - PYTHONUNBUFFERED=1
      # OTEL tracing, added 2026-08-20: off by default (core/telemetry.py's
      # init_telemetry() is a no-op unless this is truthy) -- matches the
      # otel-collector/jaeger/prometheus/grafana stack below being opt-in
      # via `--profile observability`. Set VIGIL_OTEL_ENABLED=true and run
      # with that profile to actually see traces; leaving it off costs
      # nothing (core/telemetry.py's functions are all safe no-ops when
      # disabled).
      - VIGIL_OTEL_ENABLED=${VIGIL_OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      # Bridges this container to the SAME encrypted secrets store /
      # non-secret integration config the host-run backend has been using
      # all session (AlienVault Central's client_secret + the 8 per-
      # deployment secrets, VirusTotal, etc.) -- backend/secrets_manager.py
      # and core/config.py both resolve these paths via Path.home(), which
      # inside this container (running as the unprivileged `backend` user,
      # not root) is /home/backend, not /root -- confirmed live 2026-08-18
      # this mismatch meant the container could see NONE of these secrets
      # before this mount existed, regardless of what was configured on
      # the host. Local-dev-environment convenience specifically: shares
      # secrets already managed from the Windows host into Docker Desktop.
      # A real cloud deployment has no separate "host store" to bridge --
      # secrets get entered directly against that single running instance
      # via its own Settings UI instead, and this mount doesn't apply.
      - ${USERPROFILE}/.sentry-agentic:/home/backend/.sentry-agentic
      - ${USERPROFILE}/.sentry:/home/backend/.sentry
    ports:
      - "6987:6987"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    # Network egress restriction, 2026-08-19: dual-homed -- sentry-network
    # for its real external calls (VirusTotal/AbuseIPDB/SMTP/SentinelOne
    # MCP subprocess when a chat-triggered lookup needs it), internal-only
    # to reach postgres/redis/bifrost now that those no longer have a
    # route to the internet.
    networks:
      - sentry-network
      - internal-only

  # SOC Daemon - Autonomous monitoring and response
  soc-daemon:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daemon
    container_name: sentry-daemon
    environment:
      # Database -- see backend service's comment above: POSTGRES_HOST
      # must be the Compose service name, not "localhost".
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sentry_agentic_soc
      - POSTGRES_USER=deeptempo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      - DATABASE_URL=postgresql://deeptempo:${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}@postgres:5432/sentry_agentic_soc
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      # AI
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
      # Redis (LLM queue)
      - REDIS_URL=redis://redis:6379/0
      # Polling intervals (seconds)
      - DAEMON_SPLUNK_POLL_INTERVAL=${DAEMON_SPLUNK_POLL_INTERVAL:-300}
      - DAEMON_CROWDSTRIKE_POLL_INTERVAL=${DAEMON_CROWDSTRIKE_POLL_INTERVAL:-60}
      # Processing
      - DAEMON_AUTO_TRIAGE=${DAEMON_AUTO_TRIAGE:-true}
      - DAEMON_AUTO_ENRICH=${DAEMON_AUTO_ENRICH:-true}
      - DAEMON_BATCH_SIZE=${DAEMON_BATCH_SIZE:-10}
      # Response
      - DAEMON_AUTO_RESPONSE=${DAEMON_AUTO_RESPONSE:-true}
      - DAEMON_CONFIDENCE_THRESHOLD=${DAEMON_CONFIDENCE_THRESHOLD:-0.90}
      - DAEMON_FORCE_APPROVAL=${DAEMON_FORCE_APPROVAL:-false}
      - DAEMON_DRY_RUN=${DAEMON_DRY_RUN:-false}
      # Escalation
      - DAEMON_ESCALATION_ENABLED=${DAEMON_ESCALATION_ENABLED:-true}
      - DAEMON_SLACK_ENABLED=${DAEMON_SLACK_ENABLED:-true}
      - DAEMON_SLACK_CHANNEL=${DAEMON_SLACK_CHANNEL:-#soc-alerts}
      - DAEMON_PAGERDUTY_ENABLED=${DAEMON_PAGERDUTY_ENABLED:-false}
      - DAEMON_ESCALATE_SEVERITIES=${DAEMON_ESCALATE_SEVERITIES:-critical,high}
      # Scheduler
      - DAEMON_THREAT_HUNT_ENABLED=${DAEMON_THREAT_HUNT_ENABLED:-true}
      - DAEMON_THREAT_HUNT_INTERVAL=${DAEMON_THREAT_HUNT_INTERVAL:-86400}
      - DAEMON_CLEANUP_RETENTION_DAYS=${DAEMON_CLEANUP_RETENTION_DAYS:-90}
      # Metrics / Health
      - DAEMON_METRICS_ENABLED=${DAEMON_METRICS_ENABLED:-true}
      - DAEMON_HEALTH_PORT=${DAEMON_HEALTH_PORT:-9091}
      # Webhook
      - DAEMON_WEBHOOK_ENABLED=${DAEMON_WEBHOOK_ENABLED:-true}
      - DAEMON_WEBHOOK_PORT=${DAEMON_WEBHOOK_PORT:-8081}
      # Logging
      - DAEMON_LOG_LEVEL=${DAEMON_LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      # OTEL tracing, added 2026-08-20 -- see the identical block on the
      # `backend` service above for why this defaults off. This is the
      # container that matters most for it: daemon/agent_runner.py
      # (escalated investigations) and daemon/processor.py (the routine
      # path, instrumented the same day) both emit spans through this.
      - VIGIL_OTEL_ENABLED=${VIGIL_OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      # Integrations (loaded from core/config)
      - SPLUNK_URL=${SPLUNK_URL}
      - SPLUNK_USERNAME=${SPLUNK_USERNAME}
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - CROWDSTRIKE_CLIENT_ID=${CROWDSTRIKE_CLIENT_ID}
      - CROWDSTRIKE_CLIENT_SECRET=${CROWDSTRIKE_CLIENT_SECRET}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
      # Root cause of a real live bug found 2026-08-18: this service never
      # had these two vars at all (only `backend` did, added 2026-08-18
      # earlier the same day) -- mcp-config.json's sentinelone entry needs
      # them to spawn purple-mcp, so daemon/poller.py's SentinelOne polling
      # loop failed to connect on literally every single 20s cycle since
      # this container was first started, silently (the failure was only
      # logged at .debug() until this same fix pass), leaving real alerts
      # -- including two CRITICAL ransomware detections -- completely
      # unprocessed. See the same comment on the `backend` service above.
      - SENTINELONE_API_TOKEN=${SENTINELONE_API_TOKEN:-}
      - SENTINELONE_CONSOLE_URL=${SENTINELONE_CONSOLE_URL:-}
      # Mail delivery channel -- explicit user correction 2026-08-18: this
      # WAS already set up (real Gmail SMTP creds + recipient exist in the
      # main repo-root .env), just never bridged into this compose file,
      # so capabilities/notifier.py's notify_email() had zero real SMTP
      # config in this container and every notification silently had
      # nowhere to go. services/email_service.py's EmailService reads
      # these via plain os.getenv(), not the encrypted secrets store.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_FROM=${SMTP_FROM:-}
      - THREAT_NOTIFICATION_EMAILS=${THREAT_NOTIFICATION_EMAILS:-}
      # Real on/off switch for alert-notification email, added 2026-08-20 --
      # capabilities/synergy.py::_notification_emails() checks this so you
      # can pause email notifications without clearing/re-adding the real
      # SMTP credentials above every time. Default true (no-op if unset).
      # Telegram is a separate channel/toggle, unaffected by this.
      - DAEMON_EMAIL_NOTIFICATIONS_ENABLED=${DAEMON_EMAIL_NOTIFICATIONS_ENABLED:-true}
      # Kafka ingestion (opt-in; UI toggle at /settings?tab=kafka)
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-sentry-agentic-soc}
      - KAFKA_TOPICS=${KAFKA_TOPICS:-}
      - KAFKA_AUTO_OFFSET_RESET=${KAFKA_AUTO_OFFSET_RESET:-latest}
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD:-}
      - KAFKA_SSL_CA_LOCATION=${KAFKA_SSL_CA_LOCATION:-}
      - KAFKA_MAX_POLL_RECORDS=${KAFKA_MAX_POLL_RECORDS:-500}
      - KAFKA_SESSION_TIMEOUT_MS=${KAFKA_SESSION_TIMEOUT_MS:-30000}
    volumes:
      # Same bridge as `backend`'s identical mount above -- but this
      # container's Dockerfile (docker/Dockerfile.daemon) creates and runs
      # as user `soc` (useradd -m -u 1000 soc), not `backend`, so Path.home()
      # resolves to /home/soc here, not /home/backend. Using the backend
      # container's path here would silently mount to a directory nothing
      # in this container ever reads from.
      - ${USERPROFILE}/.sentry-agentic:/home/soc/.sentry-agentic
      - ${USERPROFILE}/.sentry:/home/soc/.sentry
      # Fix for the purple-mcp cold-build-on-every-restart problem,
      # 2026-08-19: the Dockerfile's own build-time pre-warm (RUN uvx
      # --from git+...@v0.7.0 purple-mcp --help) DOES populate
      # /app/.cache/uv correctly, but live-confirmed that cache still
      # misses at runtime -- purple-mcp's dependencies (numpy, pandas,
      # cryptography, ...) aren't pinned/locked, so uv re-resolves fresh
      # on every invocation and PyPI publishing newer patch releases
      # between builds invalidates the exact-version cache keys. A named
      # volume here doesn't eliminate that drift entirely, but it makes
      # the cache durable ACROSS container recreates (unlike the current
      # image-layer snapshot, which never gets refreshed after build) --
      # a resolution that succeeds once stays warm for every subsequent
      # restart until the next genuine drift, instead of re-downloading
      # ~35MB of packages on literally every single restart as observed
      # today. Docker inherits the image's existing owned-by-soc content
      # into this volume on first mount since the directory isn't empty.
      - daemon_uv_cache:/app/.cache/uv
    ports:
      - "8081:8081"  # Webhook ingestion
      - "9090:9090"  # Prometheus /metrics (OTEL PrometheusMetricReader)
      - "9091:9091"  # Health /health + /status
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    # Bug found live 2026-08-19: daemon/main.py's graceful-shutdown drain
    # (DAEMON_SHUTDOWN_GRACE_SECONDS, default 30s -- runtime-hardening
    # gap fixed the same day) was being silently undermined by Docker's
    # own default stop timeout, 10s -- `docker restart`/`stop` SIGKILLs
    # the container well before the application's own drain logic can
    # finish. Confirmed live: shutdown logged at :09, the replacement
    # container was already initializing at :15, ~6s later, not 30s.
    # stop_grace_period must stay >= DAEMON_SHUTDOWN_GRACE_SECONDS (a
    # little headroom added) for the application-level fix to actually
    # take effect rather than being a no-op under Docker's own default.
    stop_grace_period: 35s
    # Network egress restriction, 2026-08-19: dual-homed, same reasoning
    # as backend above -- real external calls (SentinelOne, VirusTotal,
    # AbuseIPDB, Shodan, AlienVault, SMTP) need sentry-network;
    # internal-only reaches postgres/redis/bifrost.
    networks:
      - sentry-network
      - internal-only

  # ARQ Worker - Processes LLM requests from the queue
  llm-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sentry-llm-worker
    command: ["python", "-m", "services.run_llm_worker"]
    environment:
      # Database -- see backend service's comment above: POSTGRES_HOST
      # must be the Compose service name, not "localhost".
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sentry_agentic_soc
      - POSTGRES_USER=deeptempo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}
      - DATABASE_URL=postgresql://deeptempo:${POSTGRES_PASSWORD:-deeptempo_secure_password_change_me}@postgres:5432/sentry_agentic_soc
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - BIFROST_URL=${BIFROST_URL:-http://bifrost:8080}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    # Network egress restriction, 2026-08-19: kept dual-homed rather than
    # internal-only-only, deliberately -- its ClaudeService is constructed
    # with use_mcp_tools=True, and whether that means it directly executes
    # MCP tool calls (SentinelOne/VirusTotal/etc., needing real internet)
    # in-process wasn't fully traceable without risking a live regression
    # to confirm. internal-only is still needed regardless, to reach
    # postgres/redis now that those lost their sentry-network route.
    networks:
      - sentry-network
      - internal-only
    # This service reuses Dockerfile.backend but overrides CMD to run the
    # ARQ worker (services.run_llm_worker), not the FastAPI app -- so the
    # Dockerfile's baked-in HEALTHCHECK (`curl localhost:6987/api/health`)
    # always fails here: there's no HTTP server on this port in worker mode.
    # Found live 2026-08-20 (sentry-llm-worker permanently "unhealthy" while
    # functionally fine, confirmed via a live synthesize() smoke test through
    # it). Disabled rather than replaced with a process/Redis probe -- ARQ
    # doesn't have health_check_interval/health_check_key configured in
    # WorkerSettings, so there's no cheap, real signal to check yet.
    healthcheck:
      disable: true

  # ─── Multi-provider LLM gateway ───────────────────────────────────────────
  # Bifrost is the single path for all LLM traffic (GH #84 PR-B). Anthropic
  # calls hit the /anthropic passthrough (preserves extended thinking and
  # prompt caching); OpenAI/Ollama/etc. hit the /v1 OpenAI-format surface.
  # Live config lives in /app/data/config.db (SQLite); config.json is used
  # as a first-boot seed. Configure Bifrost's own exact-hash / semantic
  # cache via its UI at http://localhost:8080.
  bifrost:
    image: maximhq/bifrost:latest
    container_name: sentry-bifrost
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # wget --spider does HEAD and Bifrost /health only answers GET (405 on HEAD).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Network egress restriction, 2026-08-19: dual-homed -- sentry-network
    # for real internet access (Anthropic/OpenAI/Ollama APIs, its whole
    # purpose), internal-only so backend/daemon/llm-worker (also
    # internal-only) can reach it, and so it can reach redis (now
    # internal-only too) for its own caching.
    networks:
      - sentry-network
      - internal-only

  # PgAdmin for database management (optional, can be commented out in production)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentry-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sentry.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    # Network egress restriction, 2026-08-19: postgres is now
    # internal-only-only -- without this, pgadmin would silently be
    # unable to reach it despite starting fine and looking healthy.
    networks:
      - sentry-network
      - internal-only
    profiles:
      - dev  # Only start in dev profile

  # ─── Observability stack (opt-in: --profile observability) ────────────────

  # OpenTelemetry Collector — receives OTLP spans/metrics, fans out to Jaeger + Prometheus
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: sentry-otel-collector
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - sentry-network
    profiles:
      - observability

  # Jaeger — distributed trace UI
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sentry-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
    networks:
      - sentry-network
    profiles:
      - observability

  # Prometheus — scrapes /metrics from daemon and backend
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: sentry-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9095:9090"  # Prometheus UI on host port 9095 (avoids conflict with daemon's 9090)
    networks:
      - sentry-network
    profiles:
      - observability

  # Grafana — dashboards for system overview, LLM costs, investigation lifecycle
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sentry-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"  # Grafana UI
    depends_on:
      - prometheus
    networks:
      - sentry-network
    profiles:
      - observability

  # ─── SIEM testing ─────────────────────────────────────────────────────────

  # Splunk Enterprise for SIEM testing
  splunk:
    image: splunk/splunk:latest
    platform: linux/amd64
    container_name: sentry-splunk
    hostname: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=changeme123
      - SPLUNK_HEC_TOKEN=00000000-0000-0000-0000-000000000000
    ports:
      - "6990:8000"   # Web UI
      - "8088:8088"   # HEC (HTTP Event Collector)
      - "8089:8089"   # Management port
      - "9997:9997"   # Forwarder port
    volumes:
      - splunk_data:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
    restart: unless-stopped
    networks:
      - sentry-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - splunk  # Only start when splunk profile is active

  # ─── Kafka (opt-in: --profile kafka) ─────────────────────────────────────
  # Single-broker KRaft-mode Kafka for local streaming ingestion. See the
  # "Kafka" tab in Settings to enable the consumer and configure topics.
  kafka:
    image: apache/kafka:3.7.0
    container_name: sentry-kafka
    hostname: kafka
    ports:
      - "9092:9092"  # External listener (host)
    environment:
      # KRaft single-broker controller/broker combined
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - sentry-network
    profiles:
      - kafka

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  daemon_uv_cache:
    driver: local
  pgadmin_data:
    driver: local
  splunk_data:
    driver: local
  splunk_etc:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  kafka_data:
    driver: local

networks:
  sentry-network:
    driver: bridge
  # Network egress restriction, 2026-08-19 -- `internal: true` means
  # Docker never gives containers on this network a default route to the
  # internet, only to each other. postgres/redis are internal-only-only
  # (no legitimate reason to ever call out); every other service that
  # needs to reach them is dual-homed onto both networks.
  internal-only:
    driver: bridge
    internal: true

