mcp_server: sentinelone
entity: DeepVisibilityEvent
note: >-
  Confirmed surface is PowerQuery, not legacy Deep Visibility/S1QL 1.0
  (Milestone 1). purple_ai() is confirmed down on this tenant as of
  2026-07-30 (AuthZ error from the SentinelOne backend) -- until it recovers,
  hand-composed PowerQuery is used instead, per explicit direction, and
  everything built on it stays status: experimental
  (data/knowledge/sentinelone/dv_cookbook/). Re-check purple_ai() before
  promoting any DV artifact to stable.
tools:
  - tool: purple_ai
    when_to_use:
      - "The documented path for any DV-shaped question: pass the question in natural language, take the PowerQuery string it returns, then run that exact string through powerquery()."
    when_not_to_use:
      - Cannot access live alerts (use alerts.yaml tools) or run its own PowerQuery output (must pass to powerquery()) or change config.
      - Do not ask "generate a PowerQuery to..." -- ask focused, descriptive questions instead (e.g. "Show me PowerShell processes that connected to external IPs").
    parameters: 'query (natural language, required)'
    status_on_this_tenant: 'DOWN -- AuthZ error, confirmed via live diagnostic probe using the tool''s own documented example question, not a phrasing issue.'
    differs_from:
      alerts.get_alert_investigation_report: 'That is a pre-generated report bound to one alert. purple_ai() is free-form Q&A with no alert binding.'
  - tool: powerquery
    when_to_use:
      - "Running a PowerQuery string -- ideally one purple_ai() generated, run EXACTLY as returned. If a user supplies a specific PowerQuery not generated by purple_ai(), run it exactly as sent, per the tool's own documented instruction."
    when_not_to_use:
      - Do not hand-compose novel PowerQuery syntax when purple_ai() is available -- the tool's own author states this is unlikely to be done correctly. Hand-composition is only the fallback while purple_ai() is down, and only against fields already confirmed in the field dictionary.
      - Do not retry an empty result repeatedly -- the tool's own docs state empty results are normal.
    parameters: 'query, start_datetime, end_datetime (ISO 8601, timezone offset mandatory)'
    example: 'powerquery(query=''event.category = "process" | limit 1'', start_datetime=..., end_datetime=...)'
    guardrails: >-
      Default 24h search window recommended; 5-minute query timeout. A
      malformed/legacy field name can close the whole MCP connection, not
      just error -- treat query construction as high-stakes; test one
      candidate field per fresh connection.
    differs_from:
      alerts.search_alerts: 'Alerts are discrete triaged detections; PowerQuery is raw telemetry for behavioral hunting.'
  - tool: get_timestamp_range
    when_to_use: ['Computing a window for powerquery() instead of hand-calculating one.']
    parameters: 'none required; optional reference_time, years/months/weeks/days/hours/minutes/seconds, direction (past|future, default past)'
    example: 'get_timestamp_range(hours=24) -> {current_time, offset_time}'
  - tool: iso_to_unix_timestamp
    when_to_use: ['Converting an ISO 8601 datetime to Unix ms for the Alerts/Vulnerability/Misconfiguration/Inventory GraphQL APIs'' datetime filters -- they take Unix ms, not ISO strings.']
    parameters: 'iso_datetime (required)'
