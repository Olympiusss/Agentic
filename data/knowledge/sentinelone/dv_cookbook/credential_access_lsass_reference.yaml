template_id: credential_access_lsass_reference
hunt_pattern: credential_access
mitre:
- tactic: Credential Access
  technique_id: T1003.001
  technique_name: LSASS Memory
query_source:
  natural_language_prompt: Show me process command lines that reference lsass, or executions of procdump
    or mimikatz by name
  resulting_query: event.category = "process" and (process.cmdline contains "lsass" or process.name contains
    "procdump" or process.name contains "mimikatz") | columns event.time, endpoint.name, process.name,
    process.cmdline | limit 5
  purple_ai_status: purple_ai() failed systemically this session (confirmed via diagnostic probe, not
    a phrasing issue -- see field_dictionary.yaml). This query is hand-composed from confirmed field_dictionary.yaml
    fields as a fallback, per explicit user direction, and has NOT been generated or verified by purple_ai()
    the documented way.
  confidence_note: 'Extended post-Phase-2 (user-supplied query example, SentinelOne queries and Prompts.pdf,
    #9) to also match procdump.exe/mimikatz.exe by process.name, not just an lsass string in the command
    line -- process.name is a confirmed field. The original PDF example also checked for rundll32.exe
    with comsvcs.dll in the command line (a common LSASS-dumping technique via a signed Windows binary)
    -- left out because that specific technique needs the exact comsvcs.dll DLL-load/module context
    to distinguish from an unrelated rundll32 invocation, and no module-load field is confirmed on this
    tenant (see dv_cookbook/README.md''s open items) -- adding a bare "comsvcs.dll" cmdline-contains
    check without that context would be a much weaker, more false-positive-prone proxy than the rest
    of this template, so it was left out rather than degrade the template''s overall confidence. Still
    a weak proxy overall: command-line-string matching for ''lsass'' will miss most real LSASS-dumping
    techniques that don''t reference it literally -- this is a coarse baseline, not a refined detector.'
default_window: PT24H
result_cap: 5
false_positives_observed: []
triage_status: not independently triaged this session -- ran_without_error and result_sample below are
  the only evidence checked
status: experimental
validation_result:
  ran_without_error: true
  error: null
  result_sample: ''
