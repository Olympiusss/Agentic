template_id: credential_access_lsass_reference
hunt_pattern: credential_access
mitre:
- tactic: Credential Access
  technique_id: T1003.001
  technique_name: LSASS Memory
query_source:
  natural_language_prompt: Show me process command lines that reference lsass
  resulting_query: event.category = "process" and process.cmdline contains "lsass" | columns event.time,
    endpoint.name, process.name, process.cmdline | limit 5
  purple_ai_status: purple_ai() failed systemically this session (confirmed via diagnostic probe, not
    a phrasing issue -- see field_dictionary.yaml). This query is hand-composed from confirmed field_dictionary.yaml
    fields as a fallback, per explicit user direction, and has NOT been generated or verified by purple_ai()
    the documented way.
  confidence_note: 'Weak proxy: command-line-string matching for ''lsass'' will miss most real LSASS-dumping
    techniques (e.g. direct memory access via a dumping tool, not a literal string reference) -- this
    is a coarse baseline, not a refined detector.'
