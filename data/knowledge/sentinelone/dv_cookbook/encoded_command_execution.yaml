template_id: encoded_command_execution
hunt_pattern: living_off_the_land
mitre:
- tactic: Defense Evasion
  technique_id: T1027
  technique_name: Obfuscated Files or Information
- tactic: Execution
  technique_id: T1059.001
  technique_name: PowerShell
query_source:
  natural_language_prompt: Show me PowerShell or PsExec executions with an encoded (-enc) command line
  resulting_query: event.category = "process" and (process.name contains "powershell" or process.name
    contains "psexec") and process.cmdline contains "-enc" | columns event.time, endpoint.name, process.name,
    process.cmdline | limit 5
  purple_ai_status: purple_ai() failed systemically this session (confirmed via diagnostic probe, not
    a phrasing issue -- see field_dictionary.yaml). This query is hand-composed from confirmed field_dictionary.yaml
    fields as a fallback, per explicit user direction, and has NOT been generated or verified by purple_ai()
    the documented way.
  confidence_note: 'Adapted from a user-supplied query example (SentinelOne queries and Prompts.pdf, #3),
    which used SrcProcName/SrcProcCmdLine and a case-insensitive "Contains Anycase" -- neither field
    name nor operator variant is confirmed on this tenant, so this uses the confirmed process.name/process.cmdline
    fields and plain contains instead (case-sensitivity of contains on this tenant''s PowerQuery dialect
    is not independently confirmed). A separate, more general PowerShell-execution template
    (lolbin_powershell_execution) already exists in this cookbook -- this one is narrower and specifically
    targets the encoded-command signal, a stronger indicator on its own.'
default_window: PT24H
result_cap: 5
false_positives_observed: []
triage_status: not independently triaged this session -- ran_without_error and result_sample below are
  the only evidence checked
status: experimental
validation_result:
  ran_without_error: true
  error: null
  result_sample: ''
