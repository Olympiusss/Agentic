template_id: defense_evasion_security_tooling
hunt_pattern: defense_evasion
mitre:
- tactic: Defense Evasion
  technique_id: T1562.001
  technique_name: Impair Defenses - Disable or Modify Tools
query_source:
  natural_language_prompt: Show me attempts to stop services, kill processes, or modify Microsoft Defender
    settings
  resulting_query: event.category = "process" and (process.cmdline contains "Set-MpPreference" or process.cmdline
    contains "DisableRealtimeMonitoring" or process.name contains "taskkill") | columns event.time, endpoint.name,
    process.name, process.cmdline | limit 5
  purple_ai_status: purple_ai() failed systemically this session (confirmed via diagnostic probe, not
    a phrasing issue -- see field_dictionary.yaml). This query is hand-composed from confirmed field_dictionary.yaml
    fields as a fallback, per explicit user direction, and has NOT been generated or verified by purple_ai()
    the documented way.
  confidence_note: 'Narrowed from a user-supplied query example (SentinelOne queries and Prompts.pdf, #10),
    which also checked sc.exe/net.exe stop and -ExclusionPath/-ExclusionProcess -- kept the two clearest,
    lowest-false-positive signals (Set-MpPreference/DisableRealtimeMonitoring cmdline flags, and
    taskkill.exe by name) for this first pass; sc.exe/net.exe "stop" targets a legitimate, extremely
    common admin action (stopping any service) that would need a specific service-name allowlist to
    avoid drowning in false positives -- left out rather than fabricate that allowlist. process.name/process.cmdline
    are confirmed fields.'
default_window: PT24H
result_cap: 5
