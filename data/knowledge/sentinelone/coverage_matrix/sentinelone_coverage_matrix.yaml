- question_class: dv_hunt
  example:
  - find living-off-the-land binaries spawned from Microsoft Word
  - are there any reverse SSH tunnels from public IPs
  - show me PowerShell processes that connected to external IPs
  - find file modification events where the file was renamed to .locked or .encrypted
  - show me file downloads ending in .zip, .iso, or .html
  - find executions of whoami, nltest, or net commands
  - did anyone try to disable Windows Defender or kill security processes
  - find PowerShell or PsExec executions with an encoded command line
  - show me any references to lsass, procdump, or mimikatz
  - find registry modifications to Run or RunOnce autostart keys
  - show me rundll32 process executions
  - find PsExec-style lateral movement between hosts
  - show me DNS requests that might indicate data exfiltration
  target_entity: 'DeepVisibilityEvent (not yet formalized as an ontology entity -- Milestone 5''s DV cookbook does this)'
  source_module: Deep Visibility / PowerQuery
  # Corrected post-Phase-2: purple_ai() is confirmed permanently down (not a
  # transient outage -- consistent AuthZ failure across Milestones 5-8 and
  # months later). Letting the model retry it live produced a real, painful
  # UX failure (visible multi-turn retry thrash burning tokens, ending in a
  # wrong "the tool has limitations" message). Retrieval path is now a
  # two-level match: this row's own embedding match confirms the question is
  # DV-hunt-shaped, then services/sentinelone_recipe_executor.py's dv_hunt
  # executor does a second match against data/knowledge/sentinelone/dv_cookbook/'s
  # 11 hand-composed, MITRE-tagged templates (services/sentinelone_retrieval_store.py,
  # source="dv_hunt_template") to pick the specific one, and runs it directly
  # via powerquery() -- purple_ai() is never called.
  retrieval_path: 'router match -> dv_cookbook template retrieval (best match by embedding similarity) -> powerquery(query, start_datetime, end_datetime) using that template''s query -- never purple_ai(), confirmed permanently unavailable'
  mitre_technique: []
  expected_result_shape: varies by hunt pattern; MITRE tagging happens per-template. Every answer states it is from a hand-composed template, not Purple-AI-verified.
  priority: medium
  status: stable

- question_class: users
  example:
  - do we have a directory of user accounts
  - list our users
  - what user accounts exist in our tenant
  - show me a roster of user logins
  target_entity: InventoryItem
  source_module: Inventory
  # Milestone 9. No dedicated Users tool/entity exists. InventoryItem
  # carries an osUsername field, but the ontology's own population sample
  # marks it "rarely_present" (Milestone 1/8) -- not reliable enough for a
  # real "who's logged in" or "list our users" capability. This is
  # different from Policy/Forensics (zero tool support at all) -- a field
  # exists, it's just too sparse to build on confidently.
  retrieval_path: 'InventoryItem.osUsername exists but is rarely populated (confirmed Milestone 1/8 sampling) -- not a reliable basis for a Users capability; no dedicated Users/Identity directory tool exists in this MCP server'
  expected_result_shape: "state that a sparse, unreliable osUsername field is the only related data available, not a real user directory or login history"
  priority: low
  status: not_started
  elicited_by: 'Milestone 9 full-scope coverage audit -- Users branch of the tenant hierarchy diagram'

