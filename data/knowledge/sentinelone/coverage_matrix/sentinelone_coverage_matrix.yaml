# --- Everything else the tenant's real tool surface supports ---

- question_class: endpoint_count
  example:
  - how many endpoints do we have in total
  - what is the total number of devices in my environment
  - give me the total count of assets we manage
  - how many devices do we manage in total
  - what's our total endpoint count
  - how many machines are in my environment in total
  target_entity: InventoryItem
  source_module: Inventory
  # Added post-Phase-2 after a real production question ("what about
  # endpoints?", following up a threat-count question) was misrouted to
  # host_lookup -- which requires a specific hostname and can't answer an
  # aggregate count at all. Confirmed live: neither search_inventory_items
  # nor list_inventory_items expose a total-count field distinct from the
  # returned page -- `pagination` is confirmed always {} at limit=1, 10,
  # and 1000. The only way to get a real total is to fetch at the tool's
  # max limit (1000) and count len(data), honestly reported as a lower
  # bound (not a confirmed exhaustive total) if the page comes back full.
  retrieval_path: 'list_inventory_items(limit=1000, surface="ENDPOINT") -> count len(data); report as a lower bound if len(data) == 1000'
  expected_result_shape: integer count of endpoints (this run, live-confirmed -- 53)
  priority: high
  status: stable
  forbidden_source: Sentry internal findings store
  elicited_by: 'real user question during production use, 2026-07-30: "what about endpoints?" was misrouted to host_lookup because no aggregate-count class existed'

- question_class: group_count
  example:
  - how many groups are there in my environment
  - what groups exist in our tenant
  - list the groups we have configured
  - show me our group hierarchy
  - what are the endpoint groups in this account
  - how many groups do we have
  target_entity: InventoryItem
  source_module: Inventory
  # Added post-Phase-2 after a real production question ("how many groups
  # are there in my environment?") was misrouted to endpoint_count -- a
  # confidently wrong, fully-grounded answer (an endpoint total presented
  # as if it answered a groups question). No dedicated account/site/group
  # tool exists in this MCP server (confirmed Milestone 1); groups are only
  # recoverable as the s1GroupId/s1GroupName fields carried on every
  # InventoryItem endpoint record, per environment_map.yaml's tenant.identity
  # section (this tenant has 3 real groups: Product Engineer, Brand and
  # Marketing, Admin, under one site "Cybervergent" under one account "MU
  # ||EXN ROA - Upfront - CyberVergent Ltd"). "Groups" here means this
  # organizational/scope hierarchy concept specifically -- distinct from
  # SentinelOne's separate "Threat Groups" concept (grouping alerts/threats
  # by hash/family in the Incidents view), which is not covered by this row.
  retrieval_path: 'list_inventory_items(limit=1000, surface="ENDPOINT", fetch_fields="ALL") -> extract distinct s1GroupName per item; report as a lower bound if len(data) == 1000 (more endpoints could carry additional not-yet-seen groups)'
  expected_result_shape: 'integer count of distinct groups plus their names (this run, live-confirmed -- 3 groups: Product Engineer, Brand and Marketing, Admin)'
  priority: high
  status: stable
  forbidden_source: Sentry internal findings store
  elicited_by: 'real user question during production use, 2026-07-30: "how many groups are there in my environment?" was misrouted to endpoint_count -- a wrong count presented with full grounding'

- question_class: incident_status
  example:
  - what's our incident status breakdown
  - how many resolved incidents do we have
  - how many unresolved incidents are there
  - what's the status of our incidents
  - how many incidents are still open
  - break down our incidents by status
  target_entity: Alert
  source_module: SentinelOne Alerts
  # Milestone 9. Live re-probe (get_alert_history on 7 real alerts across
  # mixed severity/classification) confirmed "Incidents" is not a distinct
  # entity -- SentinelOne's own audit-trail text says "changed the incident
  # status ... from Unresolved to Resolved" when Alert.status changes.
  # "Incident Status" is this tenant's own console label for Alert.status
  # (NEW/IN_PROGRESS/RESOLVED). Confirmed live that status IS a real
  # server-side filter on search_alerts (string_equals), same technique
  # already used for vulnerability severity breakdowns.
  retrieval_path: 'search_alerts(filters=[{"fieldId":"status","filterType":"string_equals","value":"NEW"|"IN_PROGRESS"|"RESOLVED"}], first=1) once per status value -> read totalCount for each'
  expected_result_shape: 'per-status counts (this run, live-confirmed -- NEW 260, IN_PROGRESS 3, RESOLVED 129)'
  priority: high
  status: stable
  forbidden_source: Sentry internal findings store
  elicited_by: 'Milestone 9 full-scope coverage audit -- "Incidents" branch of the tenant hierarchy diagram'

- question_class: tenant_structure
  example:
  - describe our tenant structure
  - how many accounts do we have
  - how many sites do we have
  - what accounts and sites exist in our environment
  - show me our account and site hierarchy
  - what's the structure of our tenant
  target_entity: InventoryItem
  source_module: Inventory
  # Milestone 9, Phase 2. Formalizes Account/Site alongside the existing
  # group_count row -- same "no dedicated tool, recovered via InventoryItem
  # fields" technique, unified into one recipe per the approved design
  # (this tenant currently has exactly 1 account, 1 site; a future
  # multi-tenant client with a genuinely different shape is handled by the
  # same dynamic extraction, not hardcoded to today's counts). Deliberately
  # separate from group_count (which stays its own row, already stable and
  # router-calibrated) rather than merged into it, to avoid re-touching a
  # row that already required real router-separation tuning this session.
  retrieval_path: 'list_inventory_items(limit=1000, surface="ENDPOINT", fetch_fields="ALL") -> extract distinct s1AccountName and s1SiteName per item (same technique as group_count)'
  expected_result_shape: 'account and site names/counts (this run, live-confirmed -- 1 account "MU ||EXN ROA - Upfront - CyberVergent Ltd", 1 site "Cybervergent")'
  priority: high
  status: stable
  forbidden_source: Sentry internal findings store
  elicited_by: 'Milestone 9 full-scope coverage audit -- Accounts/Sites branches of the tenant hierarchy diagram, never previously formalized'

- question_class: application_risk
  example:
  - what applications carry the most risk in our environment
  - which applications have the most vulnerabilities
  - show me our application risk breakdown
  - what software is driving our vulnerability count
  - give me an application risk summary
  - which apps should we prioritize patching
  target_entity: Vulnerability
  source_module: Vulnerability Management
  # Milestone 9, Phase 3. Matches the screenshot's "Application Risks" table.
  # No dedicated Applications tool exists (confirmed) -- this is a DERIVED
  # view over Vulnerability.software.name (a nested field, distinct from the
  # always-constant top-level product/vendor fields, which name the
  # detecting tool "Singularity Vulnerability Management"/"SentinelOne", not
  # the affected application -- a real trap the live probe caught). Live-
  # confirmed search_vulnerabilities caps `first` at 100 (not 1000 like
  # Inventory), and a single-severity sample is badly clustered (one
  # first=100 CRITICAL-only sample came back 100% Mozilla Firefox, matching
  # a bulk same-timestamp detection batch) -- not representative. The
  # recipe instead samples 100 records from EACH of the 4 severities
  # concurrently (asyncio.gather, ~1 round-trip's latency, not 4x) for a
  # 400-record cross-section, identifies the top applications by sample
  # frequency, then runs exact softwareName-filtered count-only follow-ups
  # (confirmed server-filterable) for just those top few -- exact counts
  # for what matters most, an honest "sample, not a census" caveat for the
  # long tail. Never presents the 400-record sample's raw counts as if they
  # were tenant-wide totals.
  retrieval_path: 'search_vulnerabilities(filters=[severity=X], first=100) concurrently for X in [CRITICAL,HIGH,MEDIUM,LOW] -> aggregate by software.name -> exact softwareName-filtered total_count follow-up for the top applications found'
  expected_result_shape: 'top applications by vulnerability count with exact totals for the top few (this run, live-confirmed -- Google Chrome and Mozilla Firefox dominant, ~13 distinct applications total across a 400-record cross-section)'
  priority: high
  status: stable
  forbidden_source: Sentry internal findings store
  elicited_by: 'Milestone 9 full-scope coverage audit -- Applications branch of the tenant hierarchy diagram, matching the SentinelOne console screenshot''s Application Risks table'

- question_class: threat_detail
  example:
  - tell me more about alert <id>
  - what triggered this detection
  - what response actions were taken on this alert
  - was this threat remediated
  - who resolved this alert
  target_entity: Alert
  source_module: SentinelOne Alerts
  # Enriched Milestone 9: get_alert_history's real content (live-sampled on
  # 7 alerts) resolves two tenant-hierarchy branches that would otherwise
  # need their own fragile, hard-to-separate router classes: Response
  # Actions (MITIGATION_ACTION/MITIGATION_RESULT events -- quarantine/kill,
  # success/fail, which endpoint agent performed it) and Administrators
  # (STATUS/ANALYST_VERDICT/NOTES events attributed to a named human
  # "management user", e.g. who resolved or changed the verdict on this
  # specific alert -- real per-alert attribution, not a tenant-wide admin
  # directory, which no tool provides). Folded into this existing recipe's
  # answer rather than split into new question_classes, since "what
  # happened to this alert" is the same underlying question threat_detail
  # already answers.
  retrieval_path: 'get_alert(alert_id) + get_alert_history(alert_id) (notes/investigation-report tools as needed) -- history entries summarized in the answer (status/verdict changes with who made them, mitigation actions taken with result)'
  expected_result_shape: full alert record -- severity, verdict, classification, detection source, asset, storylineId, plus a summary of status/verdict changes (with attribution) and any response/mitigation actions taken
  priority: high
  # Corrected Milestone 7: the bound recipe in data/knowledge/sentinelone/recipes/
  # has carried `status: stable` since Milestone 4's live validation run; this
  # row's own status field was never bumped to match.
  status: stable
  forbidden_source: Sentry internal findings store

