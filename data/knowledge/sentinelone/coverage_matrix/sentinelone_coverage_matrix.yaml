  # resolved/changed this specific alert" is threat_detail's job, not this
  # row's.
  retrieval_path: no tenant-wide Activities/Audit Log tool or Administrators directory tool exists anywhere in this MCP server's 33-tool inventory (data/knowledge/sentinelone/mcp_tools.md) -- per-alert attribution is threat_detail's job (get_alert_history), not this row's
  expected_result_shape: "state plainly that no tenant-wide audit log or administrator directory exists in this tool surface; point to threat_detail for a specific alert's who-did-what"
  priority: low
  status: not_started

- question_class: policy
  example:
  - what policies do we have configured
  - show me our global policies
  - what's our policy assignment for this endpoint
  - list our endpoint protection policies
  target_entity: Policy
  source_module: none -- no tool exists
  # Milestone 9. Covers Policies, Global Policies, and Policy Assignments
  # as one row -- all three are the same underlying non-capability.
  # Confirmed by a complete scan of all 33 tools in this purple-mcp v0.7.0
  # server: zero tools target policy configuration or assignment.
  # misconfiguration policyId/policyGroup fields are CSPM/IaC detection
  # policies, a genuinely different concept, not a substitute. Integration
  # ceiling, not unfinished engineering -- closing it needs either a newer
  # purple-mcp release or a separate, direct SentinelOne Management Console
  # API integration.
  retrieval_path: no Policy/Policy-Assignment tool exists anywhere in this MCP server's 33-tool inventory (data/knowledge/sentinelone/mcp_tools.md) -- confirmed integration-level limitation, not a gap further engineering on this codebase can close
  expected_result_shape: "state plainly that no policy retrieval path exists in this tool surface; name the specific limitation, don't fall back to a generic refusal"
  priority: low
  status: not_started

