- question_class: activity_audit
  example:
  - who changed this policy
  - what admin actions happened this week
  - list our tenant administrators
  - show me the audit log
  target_entity: 'ActivityLogEntry (no tenant-wide audit-log tool exists in this MCP server)'
  source_module: none -- no tenant-wide tool exists
  # Corrected Milestone 9: this row previously claimed "no Activities/Audit
  # Log tool exists anywhere" -- overbroad. A live re-probe (get_alert_history
  # on real alerts) found real, working per-alert audit data with named
  # human attribution (see AdminActionLog ontology entity, threat_detail's
  # Milestone 9 enrichment). What's still genuinely absent, confirmed by the
  # complete 33-tool scan: (1) a TENANT-WIDE admin action log ("what admin
  # actions happened this week", across the whole tenant, not one alert),
  # (2) a directory/roster of administrator accounts, (3) any policy-change
  # log (Policy itself has zero tool support -- see the `policy` row). This
