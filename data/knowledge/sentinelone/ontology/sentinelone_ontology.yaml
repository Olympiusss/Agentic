- entity: Account
  description: >-
    Milestone 9. Top level of the tenant hierarchy (Tenant -> Accounts ->
    Sites -> Groups -> Endpoints). No dedicated Account tool exists in this
    MCP server (confirmed Milestone 1/9) -- recovered only as the
    s1AccountId/s1AccountName fields carried on every InventoryItem endpoint
    record. This tenant currently has exactly 1 account ("MU ||EXN ROA -
    Upfront - CyberVergent Ltd"), but the retrieval path is built to report
    however many distinct accounts actually exist (dynamic, not hardcoded to
    1) -- this platform is multi-tenant long-term, onboarding one client
    first, so a future tenant with a genuinely different account/site/group
    shape is handled by the same code path unchanged.
  attributes:
  - name: s1AccountId
    type: string
    population: always_present
  - name: s1AccountName
    type: string
    population: always_present
  relationships:
  - target_entity: InventoryItem
    relationship: recovered_from
    via_attribute: s1AccountId/s1AccountName
  tool_bindings:
  - tool: list_inventory_items
    purpose: extract distinct s1AccountName values -- see tenant_structure coverage-matrix row
  in_scope: true
