- entity: Storyline
  description: Attack-chain grouping referenced by Alert.storylineId. No dedicated tool exists for it
    in this MCP server -- only reachable by filtering Alerts on storylineId (the Task Execution Protocol's
    storyline pivot procedure).
  attributes:
  - name: storylineId
    type: string
    population: rarely_present
  relationships:
  - target_entity: Alert
    relationship: groups
    via_attribute: storylineId
  tool_bindings:
  - tool: search_alerts
    purpose: 'pivot: fulltext-filter alerts by storylineId to reconstruct the chain'
  in_scope: true
