status: draft_pending_review
note: Generated by scripts/build_sentinelone_ontology.py from a live tenant sample plus environment_map.yaml
  (Milestone 1). Per the build brief's Milestone 2 instruction, this is a draft requiring analyst sign-off
  (set entity.reviewed_by) before being treated as a frozen v1.
entities:
- entity: Alert
  description: SentinelOne security alert. This tenant's MCP server has no distinct 'Threats' tool --
    Alerts is the source for threat/threat-count questions (confirmed Milestone 0). Milestone 9 live
    re-probe (get_alert_history on real resolved alerts) confirms the console's "Incidents" concept is
    NOT a distinct entity -- SentinelOne's own audit-trail text says so directly, e.g. "changed the
    incident status ... from Unresolved to Resolved". "Incident Status" is this entity's own `status`
    field under a different display label, not a separate thing to model. See the `Incident` entity
    below and the `incident_status` coverage-matrix row.
  attributes:
  - name: analystVerdict
    type: string
    population: always_present
    enum_ref: alert_analyst_verdict
  - name: asset
    type: object
    population: always_present
  - name: classification
    type: string
    population: always_present
    enum_ref: alert_classification
  - name: confidenceLevel
    type: string
    population: rarely_present
  - name: dataSources
    type: array
    population: usually_present
  - name: description
    type: string
    population: always_present
  - name: detectedAt
    type: string
    population: always_present
  - name: detectionSource
    type: object
    population: always_present
  - name: externalId
    type: string
    population: always_present
  - name: firstSeenAt
    type: string
    population: always_present
  - name: id
    type: string
    population: always_present
  - name: lastSeenAt
    type: string
    population: always_present
  - name: name
    type: string
    population: always_present
  - name: noteExists
    type: boolean
    population: always_present
  - name: result
    type: string
    population: rarely_present
  - name: severity
    type: string
    population: always_present
    enum_ref: alert_severity
  - name: status
    type: string
    population: always_present
    enum_ref: alert_status
  - name: storylineId
    type: string
    population: usually_present
  relationships:
  - target_entity: InventoryItem
    relationship: affects
    via_attribute: asset
  - target_entity: Storyline
    relationship: belongs_to_storyline
    via_attribute: storylineId
  enums:
    # Re-sampled live in Milestone 7 (list_alerts, first=50, view_type=ALL)
    # -- M1/M2's 5-item discovery sample badly undercounted this space (had
    # only INFO/NEW+RESOLVED/2 verdicts/MANUAL). All values below are raw
    # values actually returned by this tenant's Alerts GraphQL API for a
    # real 50-alert sample, confirmed genuinely self-mapping (SentinelOne's
    # current API returns human-readable enum strings directly, not numeric
    # codes needing translation) -- "enum decoding" on this tenant is a
    # validated-membership check against this table, not a code lookup.
    # Still not proven exhaustive at n=50 of 385+ total alerts.
    alert_severity:
      INFO: INFO
      LOW: LOW
      MEDIUM: MEDIUM
      HIGH: HIGH
      CRITICAL: CRITICAL
    alert_status:
      NEW: NEW
      IN_PROGRESS: IN_PROGRESS
      RESOLVED: RESOLVED
    alert_analyst_verdict:
      UNDEFINED: UNDEFINED
      FALSE_POSITIVE_BENIGN: FALSE_POSITIVE_BENIGN
      FALSE_POSITIVE_UNDEFINED: FALSE_POSITIVE_UNDEFINED
      TRUE_POSITIVE_UNDEFINED: TRUE_POSITIVE_UNDEFINED
      TRUE_POSITIVE_BENIGN: TRUE_POSITIVE_BENIGN
      TRUE_POSITIVE_BENIGN_BUT_SUSPICIOUS: TRUE_POSITIVE_BENIGN_BUT_SUSPICIOUS
    alert_classification:
      MANUAL: MANUAL
      MALWARE: MALWARE
      RANSOMWARE: RANSOMWARE
    # Milestone 9: live-sampled from get_alert_history on 7 real alerts
    # (mixed MALWARE/RANSOMWARE/HIGH/CRITICAL). Not proven exhaustive, but
    # confirms the audit-trail entity's real shape: STATUS/ANALYST_VERDICT
    # changes are attributed to a named "management user" (human analyst,
    # sometimes with email); MITIGATION_ACTION/MITIGATION_RESULT are
    # attributed to "the agent <hostname>" (the endpoint itself, automated);
    # BLOCKLIST events occasionally carry a SHA-1/SHA-256 hash in free-text
    # eventText (not a structured field -- too sparse/unstructured for a
    # reliable "threat groups by hash" capability, see coverage matrix note).
    alert_history_event_type:
      STATUS: STATUS
      ANALYST_VERDICT: ANALYST_VERDICT
      MITIGATION_ACTION: MITIGATION_ACTION
      MITIGATION_RESULT: MITIGATION_RESULT
      NOTES: NOTES
      BLOCKLIST: BLOCKLIST
  lifecycle_states:
  - NEW
  - IN_PROGRESS
  - RESOLVED
  tool_bindings:
  - tool: search_alerts
    purpose: filtered search; first=1 + totalCount for count-only questions
  - tool: list_alerts
    purpose: basic listing, assignment filter only
  - tool: get_alert
    purpose: lookup by ID
  - tool: get_alert_notes
    purpose: analyst notes for one alert
  - tool: get_alert_history
    purpose: audit trail for one alert
  - tool: get_alert_investigation_report
    purpose: Purple AI auto-investigation report for one alert
  in_scope: true
- entity: Vulnerability
  description: SentinelOne vulnerability finding. Confirmed licensed and populated in this tenant.
    Corrected Milestone 7 -- Milestone 1 concluded this entity was near-empty (population checked
    via search_vulnerabilities' totalCount field, camelCase, which this tool does not return); the
    real count, read from the correct total_count (snake_case) key, is 37,863 records.
  attributes:
  - name: asset
    type: object
    population: always_present
  - name: cve
    type: object
    population: always_present
  - name: detected_at
    type: string
    population: always_present
  - name: id
    type: string
    population: always_present
  - name: last_seen_at
    type: string
    population: always_present
  - name: name
    type: string
    population: always_present
  - name: product
    type: string
    population: always_present
  - name: scope
    type: object
    population: always_present
  - name: severity
    type: string
    population: always_present
    enum_ref: vulnerability_severity
  - name: software
    type: object
    population: always_present
  - name: status
    type: string
    population: always_present
  - name: vendor
    type: string
    population: always_present
  relationships:
  - target_entity: InventoryItem
    relationship: affects
    via_attribute: asset
  enums:
    # Re-sampled live Milestone 7 via per-severity total_count queries
    # (search_vulnerabilities filtered by severity, first=1 each) now that
    # the real record count (37,863) is known. INFO returned 0 -- unlike
    # Alert severity, INFO is not a populated tier for Vulnerability here.
    vulnerability_severity:
      CRITICAL: CRITICAL
      HIGH: HIGH
      MEDIUM: MEDIUM
      LOW: LOW
  tool_bindings:
  - tool: search_vulnerabilities
    purpose: filtered search
  - tool: list_vulnerabilities
    purpose: basic listing
  - tool: get_vulnerability
    purpose: lookup by ID
  - tool: get_vulnerability_notes
    purpose: analyst notes
  - tool: get_vulnerability_history
    purpose: audit trail
  in_scope: true
