  # fetch_fields=ALL/MINIMAL): assetStatus is a management/lifecycle axis,
  # not network connectivity. Milestone 8 read agent.networkStatus="connected"
  # on 50/50 sampled endpoints and concluded the tenant had zero
  # currently-offline agents -- corrected 2026-08-06: that field doesn't
  # actually track real connectivity at all (confirmed live: an endpoint
  # stale for 3 real days still reported networkStatus="connected").
  # agent.consoleConnectivity is the field that actually varies with real
  # state and is the one now used -- boolean, not a string. Confirmed live
  # that search_inventory_items rejects "networkStatus"/"agent.networkStatus"
  # as filters (400: Unknown field), and the same constraint is assumed for
  # consoleConnectivity (untested as a server filter, same sibling-field
  # reasoning) -- agent.* is readable but not server-filterable; "which
  # agents are offline" requires a broad fetch plus client-side
