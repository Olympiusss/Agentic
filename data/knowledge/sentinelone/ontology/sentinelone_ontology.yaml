- entity: Policy
  description: >-
    SentinelOne endpoint-protection policy (covers Policies, Global Policies,
    and Policy Assignments as the console displays them -- all three are the
    same underlying non-capability here). Confirmed via a complete scan of
    all 33 tools in this purple-mcp v0.7.0 server (data/knowledge/sentinelone/
    mcp_tools.md): zero tools target policy configuration or assignment.
    misconfiguration policyId/policyGroup fields (Misconfiguration entity)
    are CSPM/IaC detection policies, a genuinely different concept, not a
    substitute. This is an integration ceiling (Milestone 9), not unfinished
    engineering -- closing it needs either a newer purple-mcp release or a
    separate, direct SentinelOne Management Console API integration.
  attributes: []
  tool_bindings: []
  in_scope: false
- entity: Incident
  description: >-
    Milestone 9 finding (live re-probe, not an assumption): this is NOT a distinct
    entity. Sampled get_alert_history on 7 real alerts across a mix of
    severities/classifications and every status-change event's own text uses
    the phrase "changed the incident status" to describe a change to Alert.status
    (e.g. "from Unresolved to Resolved", "from new to in progress").
    SentinelOne's own product terminology treats "Incident Status" as a display
    label for Alert.status, not a separate grouping concept. No incident-specific
    field, tool, or ID was found anywhere in the 33-tool inventory or in an
    unrestricted get_alert/get_alert_history sample. "How many incidents /
    what's our incident status breakdown" questions are answered by the
    `incident_status` coverage-matrix row, which is really an Alert.status
    aggregation under the console's own terminology.
  attributes: []
  tool_bindings:
  - tool: search_alerts
    purpose: 'status field IS the "incident status" concept -- see incident_status coverage-matrix row'
  in_scope: false
