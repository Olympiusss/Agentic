  in_scope: true
- entity: AdminActionLog
  description: >-
    Milestone 9 finding (live re-probe): NOT a distinct tool/entity, but a
    real, confirmed-working capability nonetheless. get_alert_history
    returns real per-alert audit events attributed to a named human
    ("the management user <Name> (<email>)") for STATUS/ANALYST_VERDICT/NOTES
    changes, and to the endpoint agent ("the agent <hostname>") for
    MITIGATION_ACTION/MITIGATION_RESULT (containment/response actions:
    quarantine, kill, success/failure). This resolves two tree branches
    partially: (1) Response Actions -- what containment actions were taken
    on a given alert IS retrievable (read-only history, not execution --
    correctly Objective 1 scope, not Objective 2); (2) Administrators --
    NOT a directory/roster of tenant admin accounts (no such tool exists),
    but per-alert attribution ("who resolved/verdict-changed THIS alert")
    is real and available. Both are folded into the existing `threat_detail`
    recipe as an enrichment rather than a new router class, since the
    natural question ("what happened to this alert", "was it remediated",
    "who closed it") is the same question threat_detail already answers --
    a separate class would only have re-created the same router-separation
    problems already fought this session (host_lookup vs agent_health vs
    endpoint_count).
  attributes: []
  tool_bindings:
  - tool: get_alert_history
    purpose: per-alert audit trail -- folded into threat_detail's enriched answer
  in_scope: true
- entity: Forensics
  description: >-
    Milestone 9. Confirmed via a complete scan of all 33 tools in this
    purple-mcp v0.7.0 server (data/knowledge/sentinelone/mcp_tools.md):
    zero tools target forensic artifacts (disk/memory images, timeline
    reconstruction beyond what get_alert_history/storyline pivot already
    covers). Integration ceiling, not unfinished engineering -- same
    category as Policy.
  attributes: []
  tool_bindings: []
  in_scope: false
