<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <radialGradient id="shieldGrad" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4D9FFF"/>
      <stop offset="40%" stop-color="#1A6AFF"/>
      <stop offset="75%" stop-color="#0040CC"/>
      <stop offset="100%" stop-color="#002699"/>
    </radialGradient>
    <radialGradient id="shieldGrad2" cx="50%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#6BB8FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0033AA" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#1A6AFF" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer glow shell -->
  <path d="M100 8 L185 45 L185 120 Q185 185 100 212 Q15 185 15 120 L15 45 Z"
    fill="#1A6AFF" opacity="0.15" filter="url(#outerGlow)"/>

  <!-- Shield body -->
  <path d="M100 12 L182 48 L182 118 Q182 182 100 208 Q18 182 18 118 L18 48 Z"
    fill="url(#shieldGrad)"/>

  <!-- Shield edge highlight (top-left shine) -->
  <path d="M100 12 L182 48 L182 70 Q150 55 100 52 Q50 55 18 70 L18 48 Z"
    fill="url(#shieldGrad2)" opacity="0.7"/>

  <!-- Shield border -->
  <path d="M100 12 L182 48 L182 118 Q182 182 100 208 Q18 182 18 118 L18 48 Z"
    fill="none" stroke="#4D9FFF" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Inner border -->
  <path d="M100 22 L172 54 L172 118 Q172 175 100 198 Q28 175 28 118 L28 54 Z"
    fill="none" stroke="#7DC4FF" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Bar 1 (left) -->
  <rect x="62" y="75" width="16" height="78" rx="8" fill="white" opacity="0.95"/>
  <circle cx="70" cy="75" r="9" fill="white" opacity="0.95"/>
  <circle cx="70" cy="153" r="9" fill="white" opacity="0.95"/>
  <circle cx="70" cy="75" r="5" fill="#1A6AFF"/>
  <circle cx="70" cy="153" r="5" fill="#1A6AFF"/>

  <!-- Bar 2 (center, taller) -->
  <rect x="92" y="60" width="16" height="98" rx="8" fill="white" opacity="0.95"/>
  <circle cx="100" cy="60" r="9" fill="white" opacity="0.95"/>
  <circle cx="100" cy="158" r="9" fill="white" opacity="0.95"/>
  <circle cx="100" cy="60" r="5" fill="#1A6AFF"/>
  <circle cx="100" cy="158" r="5" fill="#1A6AFF"/>

  <!-- Bar 3 (right) -->
  <rect x="122" y="75" width="16" height="78" rx="8" fill="white" opacity="0.95"/>
  <circle cx="130" cy="75" r="9" fill="white" opacity="0.95"/>
  <circle cx="130" cy="153" r="9" fill="white" opacity="0.95"/>
  <circle cx="130" cy="75" r="5" fill="#1A6AFF"/>
  <circle cx="130" cy="153" r="5" fill="#1A6AFF"/>
</svg>
